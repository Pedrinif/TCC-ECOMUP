[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
baseRadius = "8px"
buttonRadius = "8px"
showSidebarBorder = true

[theme.light]
primaryColor = "#1f5fbf"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b2330"
borderColor = "#dfe3e8"
dataframeHeaderBackgroundColor = "#f3f5f8"

[theme.dark]
primaryColor = "#4f8fe6"
backgroundColor = "#0f1217"
secondaryBackgroundColor = "#171c23"
textColor = "#d5dae2"
borderColor = "#2a313b"
dataframeHeaderBackgroundColor = "#1b2129"

[client]
toolbarMode = "minimal"
